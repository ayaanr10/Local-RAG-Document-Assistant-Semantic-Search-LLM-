name: Python tests
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install light test dependencies
        run: pip install pymupdf pytest
      - name: Run unit tests
        run: python -m pytest -q
      - name: Syntax validation
        run: python -m compileall -q app.py rag tests
